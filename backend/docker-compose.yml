version: '3.8'

services:
  v6-backend:
    build: .
    container_name: v6-backend
    ports:
      - "5000:5000"
    volumes:
      - ~/V6_CORE:/root/V6_CORE
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
