<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V6 Living Miracle - Video Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(90deg, #D4AF37 0%, #a08020 100%);
            padding: 30px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .subtitle { opacity: 0.9; font-size: 1.1em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
            background: #252525;
            border: 1px solid #D4AF37;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2); }
        .card h2 {
            color: #D4AF37;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #D4AF37;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #D4AF37;
            color: #fff;
            border-radius: 5px;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        button {
            background: linear-gradient(90deg, #D4AF37 0%, #a08020 100%);
            color: #000;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1.1em;
        }
        button:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }
        button:active { transform: scale(0.98); }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }
        .status.success { background: #27ae60; color: #fff; }
        .status.error { background: #e74c3c; color: #fff; }
        .status.info { background: #3498db; color: #fff; }
        .status.loading { background: #f39c12; color: #fff; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .video-item {
            background: #1a1a1a;
            padding: 15px;
            margin: 10px 0;
            border-left: 3px solid #D4AF37;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .video-info { flex: 1; }
        .video-title { color: #D4AF37; font-weight: bold; }
        .video-meta { opacity: 0.7; font-size: 0.9em; margin-top: 5px; }
        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
            margin-left: 10px;
            width: auto;
        }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            border-top: 3px solid #D4AF37;
            text-align: center;
        }
        .stat-value { font-size: 2em; color: #D4AF37; font-weight: bold; }
        .stat-label { opacity: 0.7; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 V6 Living Miracle</h1>
            <p class="subtitle">Professional Local Video Generation Studio</p>
        </header>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="grid">
            <!-- Video Creation Panel -->
            <div class="card">
                <h2>📹 Create Video</h2>
                <div class="form-group">
                    <label for="title">Video Title</label>
                    <input type="text" id="title" placeholder="Enter video title" value="🎬 Welcome to V6">
                </div>
                <div class="form-group">
                    <label for="duration">Duration (seconds)</label>
                    <input type="number" id="duration" min="1" max="3600" value="15">
                </div>
                <div class="form-group">
                    <label for="quality">Quality</label>
                    <select id="quality">
                        <option value="MOBILE">Mobile (1080x1920)</option>
                        <option value="HD">HD (1280x720)</option>
                        <option value="FULL_HD" selected>Full HD (1920x1080)</option>
                        <option value="QHD">QHD (2560x1440)</option>
                        <option value="_4K">4K (3840x2160)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="enableEffects" checked> Apply Cinematic Effects</label>
                </div>
                <button onclick="createVideo()">🚀 Generate Video</button>
                <div id="createStatus"></div>
            </div>

            <!-- Statistics Panel -->
            <div class="card">
                <h2>📊 Statistics</h2>
                <div id="statsPanel" style="font-size: 0.95em; line-height: 1.8;">
                    <p>🎥 Total Videos: <span id="totalVideos">0</span></p>
                    <p>💾 Storage Used: <span id="storageUsed">0 MB</span></p>
                    <p>⚙️ Status: <span id="appStatus" style="color: #27ae60;">Ready</span></p>
                </div>
                <button onclick="refreshStats()" style="margin-top: 15px;">🔄 Refresh Stats</button>
                <button onclick="healthCheck()" style="margin-top: 10px;">❤️ Health Check</button>
            </div>
        </div>

        <!-- Video History Panel -->
        <div class="card" style="margin-top: 20px;">
            <h2>📚 Video History</h2>
            <div id="videoHistory" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        async function createVideo() {
            const title = document.getElementById('title').value;
            const duration = parseFloat(document.getElementById('duration').value);
            const quality = document.getElementById('quality').value;
            const enableEffects = document.getElementById('enableEffects').checked;
            const status = document.getElementById('createStatus');

            status.className = 'status loading';
            status.textContent = '⏳ Generating video...';

            try {
                const response = await fetch('/api/video/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title, duration, quality, enable_effects: enableEffects})
                });
                const result = await response.json();

                if (result.success) {
                    status.className = 'status success';
                    status.textContent = `✅ Video created: ${result.video.file.split('/').pop()}`;
                    setTimeout(() => { loadHistory(); refreshStats(); }, 1000);
                } else {
                    status.className = 'status error';
                    status.textContent = `❌ Error: ${result.message}`;
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = `❌ Error: ${error.message}`;
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/video/history?limit=10');
                const result = await response.json();
                const historyDiv = document.getElementById('videoHistory');
                
                if (result.videos.length === 0) {
                    historyDiv.innerHTML = '<p style="opacity: 0.7;">No videos yet</p>';
                    return;
                }

                historyDiv.innerHTML = result.videos.map(v => `
                    <div class="video-item">
                        <div class="video-info">
                            <div class="video-title">${v.title}</div>
                            <div class="video-meta">${v.duration}s • ${v.quality} • ${new Date(v.created_at).toLocaleString()}</div>
                        </div>
                        <button class="btn-small" onclick="downloadVideo('${v.id}')">⬇️</button>
                        <button class="btn-small" onclick="deleteVideo('${v.id}')">🗑️</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        async function refreshStats() {
            try {
                const response = await fetch('/api/device/stats');
                const result = await response.json();
                document.getElementById('totalVideos').textContent = result.stats.total_videos;
                document.getElementById('storageUsed').textContent = result.stats.total_storage_mb.toFixed(2);
            } catch (error) {
                console.error('Error refreshing stats:', error);
            }
        }

        async function healthCheck() {
            try {
                const response = await fetch('/api/health');
                const result = await response.json();
                alert(`✅ System Status: ${result.status}\nVersion: ${result.version}\n\nFeatures:\n${result.features.join('\n')}`);
            } catch (error) {
                alert(`❌ Error: ${error.message}`);
            }
        }

        async function downloadVideo(videoId) {
            window.location.href = `/api/video/download/${videoId}`;
        }

        async function deleteVideo(videoId) {
            if (!confirm('Delete this video?')) return;
            try {
                const response = await fetch('/api/video/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({video_id: videoId})
                });
                const result = await response.json();
                if (result.success) {
                    loadHistory();
                    refreshStats();
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            loadHistory();
            refreshStats();
            setInterval(refreshStats, 10000);
        });
    </script>
</body>
</html>
